<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Gửi Diệu Ly 💖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,800;0,900;1,400&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <audio id="bg-music" loop preload="auto">
     <source src="Ordinary.mp3" type="audio/mpeg">
      </audio>
    <style>
      :root {
        --pink: #ff6fae;
        --rose: #ff3d84;
        --gold: #ffe0a3;
        --glow-gold: rgba(255, 224, 163, 0.4);
        --text: #fff5f8;
        --serif: "Playfair Display", Georgia, serif;
        --script: "Dancing Script", cursive;
        --sans: "Quicksand", system-ui, -apple-system, sans-serif;
        box-sizing: border-box;
      }

      *, *::before, *::after {
        box-sizing: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      body {
        background: radial-gradient(circle at 50% 25%, #420d36 0%, #20041d 75%, #110110 100%);
        color: var(--text);
        font-family: var(--sans);
        user-select: none;
        -webkit-user-select: none;
      }

      /* Ánh sáng nền huyền ảo */
      .glow {
        position: fixed;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.38;
        pointer-events: none;
        z-index: 0;
      }
      .g1 {
        width: 55vmax;
        height: 55vmax;
        background: radial-gradient(circle, #ff2d8a, transparent 70%);
        left: -15vmax;
        top: -10vmax;
        animation: floatGlow 12s ease-in-out infinite alternate;
      }
      .g2 {
        width: 45vmax;
        height: 45vmax;
        background: radial-gradient(circle, #8a3dff, transparent 70%);
        right: -12vmax;
        bottom: -10vmax;
        animation: floatGlow 16s ease-in-out infinite alternate-reverse;
      }
      @keyframes floatGlow {
        from { transform: translate(0, 0) scale(1); }
        to { transform: translate(4vw, 5vh) scale(1.15); }
      }

      /* Sao lấp lánh */
      .star {
        position: fixed;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff;
        animation: tw 3s infinite alternate ease-in-out;
        pointer-events: none;
        z-index: 1;
      }
      @keyframes tw {
        from { opacity: 0.1; transform: scale(0.8); }
        to { opacity: 0.95; box-shadow: 0 0 10px #ffb3d4; transform: scale(1.3); }
      }

      /* Nút nhạc cố định góc trên */
      #music-btn {
        position: fixed;
        top: calc(env(safe-area-inset-top, 16px) + 16px);
        right: calc(env(safe-area-inset-right, 16px) + 16px);
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 182, 213, 0.45);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        cursor: pointer;
        z-index: 100;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
        transition: transform 0.25s, box-shadow 0.25s, background-color 0.25s;
      }
      #music-btn:hover {
        transform: scale(1.08);
      }
      #music-btn.playing {
        animation: rotateMusic 5s linear infinite;
        box-shadow: 0 0 20px rgba(255, 111, 174, 0.7);
        border-color: rgba(255, 111, 174, 0.9);
      }
      @keyframes rotateMusic {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Giai đoạn 1: Màn giải mã */
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 2;
        padding: 1.5rem;
      }
      #stage.hide {
        opacity: 0;
        transform: scale(0.9);
        pointer-events: none;
      }

      .line {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        font-family: var(--serif);
        font-weight: 900;
        line-height: 1.2;
        text-align: center;
      }
      .l1 {
        font-size: clamp(1.8rem, 7vw, 3.8rem);
        color: #ffffff;
        letter-spacing: 0.04em;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
      }
      .l2 {
        font-size: clamp(2.8rem, 12vw, 5.8rem);
        color: var(--pink);
        text-shadow: 0 0 35px var(--rose), 0 0 10px rgba(255, 255, 255, 0.6);
        margin-top: 0.2rem;
      }

      .slot {
        display: inline-block;
        opacity: 0;
        min-width: 0.05em;
        transition: opacity 0.3s;
      }
      .slot.sp {
        min-width: 0.35em;
      }
      .slot.ok {
        opacity: 1;
        animation: pop 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      }
      @keyframes pop {
        0% { transform: scale(1.8); filter: brightness(2.5); }
        100% { transform: scale(1); filter: none; }
      }

      .fly {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 5;
        pointer-events: none;
        font-family: var(--serif);
        font-weight: 900;
        color: #ffb3d4;
        text-shadow: 0 0 15px var(--rose);
        will-change: transform;
        transition: opacity 0.8s;
      }

      #hint {
        font-family: var(--script);
        font-size: clamp(1.4rem, 4.5vw, 1.85rem);
        color: var(--gold);
        text-shadow: 0 0 12px var(--glow-gold);
        animation: pulseHint 2s infinite ease-in-out;
        margin-top: 0.6rem;
        text-align: center;
      }
      @keyframes pulseHint {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }

      #decode-btn {
        padding: 0.95rem 2.4rem;
        border: 0;
        border-radius: 99px;
        font: 600 1.15rem var(--sans);
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, #ff6fae 0%, #ff3d84 100%);
        box-shadow: 0 8px 30px rgba(255, 61, 132, 0.55), inset 0 1px 2px rgba(255, 255, 255, 0.4);
        transition: transform 0.25s, box-shadow 0.25s;
        z-index: 6;
      }
      #decode-btn:hover {
        transform: translateY(-2px) scale(1.05);
        box-shadow: 0 12px 35px rgba(255, 61, 132, 0.7);
      }
      #decode-btn:active {
        transform: translateY(1px) scale(0.98);
      }

      /* Giai đoạn 2: Khung thiệp chúc mừng */
      #card {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1.2rem;
        z-index: 4;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        overflow-y: auto;
      }
      #card.show {
        opacity: 1;
        pointer-events: auto;
      }

      .box {
        position: relative;
        margin: auto;
        max-width: 440px;
        width: 100%;
        text-align: center;
        padding: 2.2rem 1.6rem 1.8rem;
        border-radius: 28px;
        background: linear-gradient(155deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.05) 100%);
        border: 1px solid rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 
          0 20px 60px rgba(0, 0, 0, 0.45),
          0 0 35px rgba(255, 61, 132, 0.35),
          inset 0 0 25px rgba(255, 255, 255, 0.08);
        transform: scale(0.85) translateY(40px);
        transition: transform 1.2s cubic-bezier(0.18, 1.15, 0.25, 1);
      }
      #card.show .box {
        transform: none;
      }

      .badge {
        display: inline-block;
        padding: 0.32rem 1.1rem;
        border-radius: 99px;
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #4a0d33;
        font-weight: 700;
        background: linear-gradient(90deg, #ffe0a3, #ffb3d4);
        box-shadow: 0 0 20px rgba(255, 217, 168, 0.45);
      }

      .heart-icon {
        font-size: 2.4rem;
        margin: 0.6rem 0 0.2rem;
        display: inline-block;
        animation: beatHeart 1.3s infinite ease-in-out;
      }
      @keyframes beatHeart {
        0%, 100% { transform: scale(1); }
        15% { transform: scale(1.28); }
        30% { transform: scale(1.05); }
        45% { transform: scale(1.2); }
      }

      .t1 {
        font-family: var(--script);
        font-size: 1.4rem;
        color: var(--gold);
        margin: 0.2rem 0;
      }

      .t2 {
        font-family: var(--serif);
        font-size: clamp(2rem, 8vw, 2.7rem);
        margin: 0 0 0.3rem;
        font-weight: 900;
        background: linear-gradient(90deg, #ff9ec8, #ffffff, #ffe0a3, #ff6fae, #ff9ec8);
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 5s linear infinite;
      }
      @keyframes shimmer {
        to { background-position: -300% 0; }
      }

      .orn {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        justify-content: center;
        color: var(--pink);
        margin: 0.4rem 0 1.2rem;
        font-size: 0.95rem;
      }
      .orn:before, .orn:after {
        content: "";
        height: 1px;
        width: 25%;
        background: linear-gradient(90deg, transparent, var(--pink));
      }
      .orn:after {
        transform: scaleX(-1);
      }

      #msg {
        font-weight: 500;
        font-size: 0.96rem;
        line-height: 1.75;
        min-height: 5.5em;
        margin: 0 0.4rem;
        color: #fff9fc;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      }

      .wishes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.65rem;
        margin: 1.1rem 0;
      }
      .w {
        padding: 0.65rem 0.5rem;
        border-radius: 14px;
        /* Tăng nền đậm hơn một chút để chữ không bị chìm vào nền chính */
        background: rgba(30, 8, 32, 0.65);
        /* Viền sáng hơn để tạo khối rõ ràng */
        border: 1px solid rgba(255, 182, 213, 0.45);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        opacity: 0;
        transform: translateY(20px) scale(0.9);
        transition: all 0.8s cubic-bezier(0.2, 1.4, 0.3, 1);
      }
      .w.on {
        opacity: 1;
        transform: none;
      }
      .w i {
        font-style: normal;
        font-size: 1.35rem;
        display: block;
        margin-bottom: 0.2rem;
      }
      .w b {
        display: block;
        font-family: var(--sans);
        font-size: 0.9rem;
        font-weight: 600;
        /* Đổi tiêu đề sang màu vàng kim/hồng sáng để đọc rõ mồn một */
        color: #ffd9a8;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        margin: 0.2rem 0;
      }
      .w span {
        font-size: 0.76rem;
        font-weight: 400;
        /* Đổi nội dung thành màu trắng kem sáng, tăng độ rõ */
        color: #ffffff;
        opacity: 0.95;
        line-height: 1.5;
        display: block;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }

      .quote {
        font-family: var(--script);
        font-size: 1.25rem;
        color: var(--gold);
        line-height: 1.5;
        margin: 0.9rem 0 0.3rem;
        opacity: 0;
        transition: opacity 1.2s;
        text-shadow: 0 0 12px var(--glow-gold);
      }
      .sign {
        font-family: var(--script);
        font-size: 1.25rem;
        color: var(--pink);
        margin: 0.3rem 0;
        opacity: 0;
        transition: opacity 1.2s;
      }
      .on2 {
        opacity: 1;
      }

      .footer-hint {
        margin-top: 0.8rem;
        font-size: 0.76rem;
        opacity: 0;
        color: rgba(255, 255, 255, 0.6);
        transition: opacity 1s;
      }

      /* Các hiệu ứng bay & tương tác */
      .heart {
        position: fixed;
        bottom: -50px;
        z-index: 1;
        pointer-events: none;
        animation: flyUp linear forwards;
        filter: drop-shadow(0 0 8px rgba(255, 61, 132, 0.65));
      }
      @keyframes flyUp {
        to {
          transform: translate(var(--dx), -115vh) rotate(var(--rot));
          opacity: 0;
        }
      }

      .burst {
        position: fixed;
        z-index: 99;
        pointer-events: none;
        animation: burstAnimation 0.9s ease-out forwards;
      }
      @keyframes burstAnimation {
        to {
          transform: translate(var(--bx), var(--by)) scale(0.3);
          opacity: 0;
        }
      }

      /* Con trỏ chuột trái tim lung linh (chỉ hiện trên thiết bị hỗ trợ chuột) */
      @media (hover: hover) and (pointer: fine) {
        * { cursor: none !important; }
        #cur {
          position: fixed;
          left: 0;
          top: 0;
          z-index: 999;
          pointer-events: none;
          font-size: 24px;
          color: #ff3d84;
          text-shadow: 0 0 12px #ff3d84, 0 0 25px #ff6fae;
          opacity: 0;
          transition: opacity 0.25s ease-out;
        }
        #cur span {
          display: inline-block;
          animation: beatHeart 1.2s infinite;
        }
        .trail {
          position: fixed;
          z-index: 998;
          pointer-events: none;
          transform: translate(-50%, -50%);
          animation: trailAnimation 1.1s ease-out forwards;
          text-shadow: 0 0 8px rgba(255, 61, 132, 0.8);
        }
        @keyframes trailAnimation {
          to {
            transform: translate(calc(-50% + var(--tx)), -80px) scale(0.3);
            opacity: 0;
          }
        }
      }
    </style>
  </head>
  <body>
    <!-- Nhạc nền & Nút điều khiển xoay -->
    <audio id="bg-music" loop preload="auto">
      <source
        src="https://assets.mixkit.co/music/preview/mixkit-romantic-moment-1144.mp3"
        type="audio/mpeg"
      />
    </audio>

    <button id="music-btn" title="Bật/Tắt Nhạc" aria-label="Bật hoặc tắt nhạc">
      🎵
    </button>

    <!-- Quầng sáng hiệu ứng nền -->
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <!-- Màn 1: Giải mã chữ bay -->
    <div id="stage">
      <div class="line l1" id="l1"></div>
      <div class="line l2" id="l2"></div>
      <div id="hint">✦ Có một thông điệp đang bay lạc... ✦</div>
      <button id="decode-btn">Giải mã 💌</button>
    </div>

    <!-- Màn 2: Thiệp chúc mừng -->
    <div id="card">
      <div class="box">
        <span class="badge">20 · 10 &nbsp;Phụ nữ Việt Nam</span>
        <div class="heart-icon">💖</div>
        <p class="t1">Gửi riêng cho</p>
        <h1 class="t2" id="name"></h1>
        <div class="orn">❀ ❤ ❀</div>
        <div id="msg"></div>
        <div class="wishes" id="wishes"></div>
        <div class="quote" id="quote"></div>
        <div class="sign" id="sign"></div>
        <div class="footer-hint" id="footer-hint">
          Chạm vào màn hình hoặc bấm Phím Cách để thả thêm tim ✨
        </div>
      </div>
    </div>

    <script>
      const CFG = {
        l1: "CHÚC MỪNG 20/10",
        l2: "Diệu Ly",
        name: "Diệu Ly",
        intro:
          "Chúc Diệu Ly ngày 20/10 thật nhiều niềm vui! Mong em luôn giữ được sự vui vẻ, yêu đời, công việc hay học tập đều suôn sẻ và luôn có thời gian chăm sóc tốt cho bản thân nhé. ✨",
        wishes: [
          ["☕", "Thảnh thơi", "Mỗi ngày đều có những khoảng lặng dễ chịu."],
          ["🍀", "May mắn", "Làm việc gì cũng thuận lợi, hanh thông."],
          ["🔋", "Tràn đầy năng lượng", "Luôn tích cực và cười nhiều hơn."],
          ["🍰", "Ngọt ngào", "Ăn ngon, ngủ ngon và tận hưởng từng ngày."],
        ],
        quote: "Chúc em luôn tìm thấy niềm vui trong những điều bình dị nhất.",
        sign: "— I still look for you in every crowd🌿",
      };

      const POOL = "ABCDEFGHIKLMNOPQRSTUVXYĂÂÊÔƠƯ0123456789";
      const rnd = (a) =>
        Array.isArray(a) || typeof a === "string"
          ? a[Math.floor(Math.random() * a.length)]
          : 0;
      const R = (a, b) => Math.random() * (b - a) + a;
      const $ = (id) => document.getElementById(id);

      // Tạo các đốm sao lấp lánh nền
      for (let i = 0; i < 65; i++) {
        const s = document.createElement("div");
        s.className = "star";
        s.style.cssText = `left:${R(0, 100)}vw;top:${R(0, 100)}vh;animation-delay:${R(0, 3)}s`;
        document.body.appendChild(s);
      }

      $("name").textContent = CFG.name;
      $("sign").textContent = CFG.sign;
      $("quote").textContent = CFG.quote;
      $("wishes").innerHTML = CFG.wishes
        .map(
          (w) =>
            `<div class="w"><i>${w[0]}</i><b>${w[1]}</b><span>${w[2]}</span></div>`
        )
        .join("");

      /* Xử lý Nhạc Nền */
      const audio = $("bg-music");
      const musicBtn = $("music-btn");
      let isPlaying = false;

      function playMusic() {
        if (!isPlaying && audio) {
          audio
            .play()
            .then(() => {
              isPlaying = true;
              musicBtn.classList.add("playing");
            })
            .catch(() => {});
        }
      }

      function toggleMusic(e) {
        if (e) e.stopPropagation();
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
          musicBtn.classList.remove("playing");
        } else {
          audio.play().then(() => {
            isPlaying = true;
            musicBtn.classList.add("playing");
          });
        }
      }
      musicBtn.addEventListener("click", toggleMusic);

      /* Xử lý hiệu ứng chữ bay giải mã */
      const flyers = [];
      let W = window.innerWidth,
        H = window.innerHeight,
        decoding = false,
        landed = 0,
        total = 0;

      function buildSlots(el, text, cls) {
        [...text].forEach((c) => {
          const s = document.createElement("span");
          s.className = "slot" + (c === " " ? " sp" : "");
          s.textContent = c === " " ? "\u00a0" : c;
          el.appendChild(s);
          if (c !== " ") flyers.push({ slot: s, c, cls, real: true });
        });
      }
      buildSlots($("l1"), CFG.l1, "l1");
      buildSlots($("l2"), CFG.l2, "l2");
      total = flyers.length;

      function initFlyers() {
        // Tạo các ký tự thật
        flyers.forEach((f) =>
          createFlyer(f, parseFloat(getComputedStyle(f.slot).fontSize))
        );
        // Tạo các ký tự gây nhiễu bay tự do
        for (let i = 0; i < 35; i++) {
          const f = { real: false, c: "", cls: "" };
          flyers.push(f);
          createFlyer(f, R(20, 52));
        }
        requestAnimationFrame(tickFlyers);
      }

      function createFlyer(f, size) {
        const e = document.createElement("div");
        e.className = "fly";
        e.style.fontSize = size + "px";
        e.style.opacity = f.real ? "1" : "0.5";
        e.style.color = rnd([
          "#ffb3d4",
          "#ff6fae",
          "#ffe0a3",
          "#e6b3ff",
          "#ffffff",
        ]);
        e.textContent = rnd(POOL);
        document.body.appendChild(e);

        Object.assign(f, {
          el: e,
          x: R(0, W),
          y: R(0, H),
          vx: R(-2.4, 2.4),
          vy: R(-2.4, 2.4),
          rot: R(0, 360),
          vr: R(-3.5, 3.5),
          t: R(0, 6),
          sc: 1,
          state: "fly",
        });
      }

      function tickFlyers() {
        flyers.forEach((f) => {
          if (f.state === "done" || !f.el) return;

          if (f.state === "fly") {
            f.vx += R(-0.1, 0.1);
            f.vy += R(-0.1, 0.1);
            const m = Math.hypot(f.vx, f.vy),
              mx = 3.2;
            if (m > mx) {
              f.vx *= mx / m;
              f.vy *= mx / m;
            }
            f.x += f.vx;
            f.y += f.vy;
            f.rot += f.vr;
            f.t += 0.04;
            f.sc = 1 + Math.sin(f.t) * 0.3;

            if (f.x < 0 || f.x > W) f.vx *= -1;
            if (f.y < 0 || f.y > H) f.vy *= -1;
            f.x = Math.max(-10, Math.min(W + 10, f.x));
            f.y = Math.max(-10, Math.min(H + 10, f.y));
          } else if (f.state === "go") {
            const k = 0.08;
            f.x += (f.tx - f.x) * k;
            f.y += (f.ty - f.y) * k;
            f.rot += (0 - f.rot) * k;
            f.sc += (1 - f.sc) * k;
            if (Math.hypot(f.tx - f.x, f.ty - f.y) < 1.4 && Math.abs(f.rot) < 1.5) {
              landFlyer(f);
            }
          }
          f.el.style.transform = `translate(${f.x}px,${f.y}px) translate(-50%,-50%) rotate(${f.rot}deg) scale(${f.sc})`;
        });
        requestAnimationFrame(tickFlyers);
      }

      function landFlyer(f) {
        f.state = "done";
        if (f.el) f.el.remove();
        f.slot.classList.add("ok");
        sparkleElement(f.slot);
        if (++landed === total) {
          $("hint").textContent = "Giải mã thành công 💖";
          heartStorm();
          setTimeout(showCard, 1600);
        }
      }

      setInterval(() => {
        flyers.forEach((f) => {
          if (f.el && f.state === "fly" && Math.random() < 0.45) {
            f.el.textContent = rnd(POOL);
          }
        });
      }, 140);

      function decode() {
        playMusic(); // Kích hoạt phát nhạc khi người dùng tương tác
        if (decoding) return;
        decoding = true;
        $("decode-btn").style.display = "none";
        $("hint").textContent = "Các mảnh ghép đang tìm về nhau... ✨";

        let i = 0;
        flyers.forEach((f) => {
          if (f.real) {
            setTimeout(() => {
              const r = f.slot.getBoundingClientRect();
              f.tx = r.left + r.width / 2;
              f.ty = r.top + r.height / 2;
              f.rot = (((f.rot % 360) + 540) % 360) - 180;
              f.state = "go";
              f.el.textContent = f.c;
            }, 500 + i++ * 150);
          } else {
            setTimeout(() => {
              if (f.el) f.el.style.opacity = "0";
            }, 400 + R(0, 1400));
            setTimeout(() => {
              f.state = "done";
              if (f.el) f.el.remove();
            }, 2400);
          }
        });
      }

      $("decode-btn").addEventListener("click", decode);
      $("stage").addEventListener("click", (e) => {
        if (e.target.id !== "decode-btn") decode();
      });

      window.addEventListener("resize", () => {
        W = window.innerWidth;
        H = window.innerHeight;
      });

      (document.fonts && document.fonts.ready
        ? document.fonts.ready
        : Promise.resolve()
      ).then(initFlyers);

      /* Hiệu ứng lấp lánh & Pháo hoa tim */
      function sparkleElement(el) {
        const r = el.getBoundingClientRect();
        for (let i = 0; i < 4; i++) {
          burst(r.left + r.width / 2, r.top + r.height / 2, "✦", 10);
        }
      }

      function burst(x, y, ch, size) {
        const b = document.createElement("div");
        b.className = "burst";
        b.textContent = ch;
        b.style.cssText += `left:${x}px;top:${y}px;font-size:${size + R(0, 10)}px;color:#ffc2dc;--bx:${R(-75, 75)}px;--by:${R(-75, 75)}px`;
        document.body.appendChild(b);
        setTimeout(() => b.remove(), 900);
      }

      const HEARTS = ["💖", "🌸", "💕", "🌹", "💗", "🌷", "✨", "💝"];
      function spawnFloatingHeart() {
        const h = document.createElement("div");
        h.className = "heart";
        h.textContent = rnd(HEARTS);
        const duration = R(5, 10);
        h.style.cssText += `left:${R(0, 100)}vw;font-size:${R(18, 40)}px;animation-duration:${duration}s;--dx:${R(-80, 80)}px;--rot:${R(-45, 45)}deg;opacity:${R(0.65, 1)}`;
        document.body.appendChild(h);
        setTimeout(() => h.remove(), duration * 1000);
      }

      function heartStorm() {
        for (let i = 0; i < 35; i++) {
          setTimeout(spawnFloatingHeart, i * 65);
        }
      }

      /* Màn thiệp chúc mừng chi tiết */
      function showCard() {
        $("stage").classList.add("hide");
        $("card").classList.add("show");
        setInterval(spawnFloatingHeart, 320);
        heartStorm();

        let i = 0;
        setTimeout(function typeWriter() {
          $("msg").textContent = CFG.intro.slice(0, ++i);
          if (i < CFG.intro.length) {
            setTimeout(typeWriter, 38);
          } else {
            document.querySelectorAll(".w").forEach((w, idx) => {
              setTimeout(() => w.classList.add("on"), idx * 300);
            });
            setTimeout(() => $("quote").classList.add("on2"), 1500);
            setTimeout(() => $("sign").classList.add("on2"), 2200);
            setTimeout(() => ($("footer-hint").style.opacity = "1"), 2800);
          }
        }, 1000);
      }

      // Nhấn Space để giải mã hoặc thả tim
      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          if (!decoding) decode();
          else heartStorm();
        }
      });

      // Nhấp trên thiệp để bắn hiệu ứng tim
      $("card").addEventListener("pointerdown", (e) => {
        if (e.target.id !== "music-btn") {
          playMusic();
          for (let i = 0; i < 7; i++) {
            burst(e.clientX, e.clientY, rnd(HEARTS), 18);
          }
        }
      });

      // Con trỏ chuột trái tim cho Desktop
      if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
        const cur = document.createElement("div");
        cur.id = "cur";
        cur.innerHTML = "<span>❤</span>";
        document.body.appendChild(cur);

        let lastTime = 0;
        window.addEventListener("pointermove", (e) => {
          cur.style.transform = `translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`;
          cur.style.opacity = "1";

          const now = performance.now();
          if (now - lastTime < 50) return;
          lastTime = now;

          const trail = document.createElement("div");
          trail.className = "trail";
          trail.textContent = rnd(["❤", "💖", "🌸", "✨"]);
          trail.style.cssText += `left:${e.clientX}px;top:${e.clientY}px;font-size:${R(12, 22)}px;--tx:${R(-30, 30)}px`;
          document.body.appendChild(trail);
          setTimeout(() => trail.remove(), 1100);
        });

        document.addEventListener("mouseleave", () => (cur.style.opacity = "0"));
      }
    </script>
  </body>
</html>
